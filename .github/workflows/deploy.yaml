name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: read

jobs:
  publish:
    name: Publish GHCR image
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.image.outputs.tag }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define immutable image tag
        id: image
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "tag=${VERIFIED_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ steps.image.outputs.tag }}
          tags: ghcr.io/jamesmukumu/florahclient:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}

  deploy:
    name: Deploy production
    needs: publish
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: flora-production
      cancel-in-progress: false

    steps:
      - name: Check out deployment assets
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${VPS_SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${VPS_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload deployment assets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -p "${VPS_PORT}" -o StrictHostKeyChecking=yes "${VPS_USER}@${VPS_HOST}" 'install -d -m 750 /opt/florahClient'
          scp -P "${VPS_PORT}" -o StrictHostKeyChecking=yes compose.production.yaml scripts/deploy.sh "${VPS_USER}@${VPS_HOST}:/opt/florahClient/"

      - name: Deploy and verify release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
        run: |
          ssh -p "${VPS_PORT}" -o StrictHostKeyChecking=yes "${VPS_USER}@${VPS_HOST}" "chmod 700 /opt/florahClient/deploy.sh && /opt/florahClient/deploy.sh '${IMAGE_TAG}'"
