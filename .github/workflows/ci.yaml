name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build production server
        run: npm run build

      - name: Build container image
        run: docker build --build-arg VERSION="${GITHUB_SHA}" --tag flora-advocates:ci .

      - name: Scan container image
        # Run the official Trivy image directly to avoid the binary installer.
        # Pin the Linux amd64 image for Trivy 0.65.0 (ubuntu-24.04 runners).
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.65.0@sha256:16f1ee8462d0ba07dd69239150d60ba7b591c55e02dfc33a3fc19710b861d180 \
            image --image-src docker --format table --exit-code 1 \
            --ignore-unfixed --severity HIGH,CRITICAL \
            flora-advocates:ci
